schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Qianyi, a Blender add-on for fabric simulation and garment design
  (GPL-3.0-or-later, requires Blender 4.3+).
  - Tech stack: Python 3.11 (Blender's interpreter) plus the compiled
    Qianyi_DP engine module; no third-party Python packages - only the numpy
    bundled with Blender.
  - Domain model: a project (node tree) holds patterns, sewings and fabrics.
    A pattern is a 2D outline of vertices and edges (a two-point edge with
    handles is a cubic Bezier, a multi-point edge is an interpolating cubic
    spline, vector handles make a straight line) plus optional internal lines.
    Panel meshes are sampled from the boundary at the pattern's granularity.
    A sewing stores an edge identity plus a normalized position for each side
    and can span consecutive edges.
  - The simulation bridge sends one mesh payload per object (vertices, edges,
    triangles, world matrix, fabric, collision layer, grain direction, pins)
    plus the sewing list to the engine; the engine does not care how a panel
    was created.
  - Code comments and committed artifacts are written in English.
  - Numeric work is written with numpy vector operations rather than Python
    loops or list comprehensions. A loop is only acceptable where the work is
    inherently per-object (RNA property writes on Blender collections, one UI
    widget per item, building a list of Python objects), and such a loop MUST
    carry a comment saying why numpy cannot be used there.

# Per-artifact rules (optional)
